<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DCP Confession Page</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* High Visibility WhatsApp Doodle Pattern */
    .whatsapp-doodle-bg {
      background-color: #0c1317;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23223038' fill-opacity='0.85' fill-rule='evenodd'%3E%3Cpath d='M15 12h6v6h-6zM32 8h4v4h-4zM8 42h8v8H8zM65 14a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10zM42 58c0-4.5 3.5-8 8-8s8 3.5 8 8-3.5 8-8 8-8-3.5-8-8zm20-38h10v3H62zm-25 42h16v2.5H37zm42 16a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm-66 4h8v8h-8zm58-54l5-5 2.5 2.5-5 5zM8 70l10-6.5v13zM78 66h7v7h-7zm-4-30h12v2.5H74zm-50-4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm-4 38a4 4 0 1 1 8 0 4 4 0 0 1-8 0zm70-12l-6 6-3.5-3.5 6-6z'/%3E%3C/g%3E%3C/svg%3E");
    }

    /* 💎 Shining Electric Blue Bubble (Your Messages) */
    .bubble-sent {
      background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc);
      box-shadow: 0 0 15px rgba(67, 100, 247, 0.65), 0 0 3px rgba(111, 177, 252, 0.8);
      border-radius: 18px 18px 4px 18px;
    }

    /* 🖤 Pure Black Bubble (Opposite Messages) */
    .bubble-received {
      background: #000000;
      border: 1px solid #1f2937;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
      border-radius: 18px 18px 18px 4px;
    }

    .glow-green { box-shadow: 0 0 8px #22c55e, 0 0 16px #22c55e; }
    .glow-red { box-shadow: 0 0 8px #ef4444, 0 0 16px #ef4444; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-black text-gray-100 flex justify-center items-center min-h-screen select-none m-0 p-0 overflow-hidden">

  <!-- Mobile Frame -->
  <div class="w-full max-w-md h-screen sm:h-[94vh] bg-[#111b21] flex flex-col sm:rounded-3xl overflow-hidden shadow-2xl relative border border-gray-800">

    <!-- ================= SCREEN 1: LOGIN ================= -->
    <div id="screen-1" style="display: flex;" class="h-full w-full flex-col justify-center px-8 z-10">
      <div class="text-center mb-10">
        <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-400 rounded-3xl mx-auto flex items-center justify-center shadow-lg shadow-blue-500/30 mb-4 transform rotate-3">
          <i class="fa-solid fa-mask text-3xl text-white"></i>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-wide">DCP Confessions</h1>
        <p class="text-xs text-gray-400 mt-1">100% Anonymous • Secret • Encrypted</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-gray-400 text-xs uppercase tracking-wider mb-2 font-semibold">Enter your email</label>
          <input type="email" id="email-field" placeholder="student@example.com"
            class="w-full px-4 py-3.5 rounded-xl bg-[#202c33] border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition">
          <p id="email-error" style="display: none;" class="text-red-400 text-xs mt-1 font-medium">Valid email address likhein (e.g. name@gmail.com)</p>
        </div>

        <button onclick="handleLoginEmail()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 font-semibold rounded-xl text-white transition shadow-lg shadow-blue-600/30 active:scale-95">
          Continue
        </button>

        <div class="flex items-center my-4">
          <div class="flex-1 border-t border-gray-800"></div>
          <span class="px-3 text-xs text-gray-500 font-medium tracking-widest uppercase">OR</span>
          <div class="flex-1 border-t border-gray-800"></div>
        </div>

        <!-- Continue with Google Button -->
        <button onclick="openGoogleAccountChooser()" class="w-full py-3.5 bg-white hover:bg-gray-100 text-gray-800 font-medium rounded-xl flex items-center justify-center space-x-3 transition shadow active:scale-95">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.27v3.15C3.25 21.36 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.27C.46 8.2.0 10.04.0 12s.46 3.8 1.27 5.42l4.01-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.64 1.27 6.58l4.01 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </div>
    </div>

    <!-- Google Accounts Selector Modal -->
    <div id="google-modal" style="display: none;" class="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col justify-end">
      <div class="bg-[#1f2c34] border-t border-gray-700 rounded-t-3xl p-6 shadow-2xl">
        <div class="flex items-center justify-between pb-3 border-b border-gray-700 mb-4">
          <div class="flex items-center space-x-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.3l3.7 2.9C6.2 7.4 8.9 5 12 5z"/></svg>
            <span class="text-sm font-semibold text-white">Choose a Google Account</span>
          </div>
          <button onclick="closeModal('google-modal')" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <div class="space-y-3">
          <button onclick="selectGoogleAccount('umer.personal@gmail.com', 'Umer Personal')" class="w-full flex items-center space-x-3 p-3 rounded-xl bg-[#111b21] hover:bg-[#202c33] border border-gray-800 text-left transition">
            <div class="w-9 h-9 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm">U</div>
            <div class="flex-1 overflow-hidden">
              <p class="text-sm font-medium text-white">Umer Personal</p>
              <p class="text-xs text-gray-400 truncate">umer.personal@gmail.com</p>
            </div>
          </button>

          <button onclick="selectGoogleAccount('student.dcp@gmail.com', 'DCP Student')" class="w-full flex items-center space-x-3 p-3 rounded-xl bg-[#111b21] hover:bg-[#202c33] border border-gray-800 text-left transition">
            <div class="w-9 h-9 rounded-full bg-purple-600 text-white font-bold flex items-center justify-center text-sm">D</div>
            <div class="flex-1 overflow-hidden">
              <p class="text-sm font-medium text-white">DCP Student</p>
              <p class="text-xs text-gray-400 truncate">student.dcp@gmail.com</p>
            </div>
          </button>

          <button onclick="customGooglePrompt()" class="w-full flex items-center space-x-3 p-3 rounded-xl bg-transparent hover:bg-[#111b21] border border-dashed border-gray-700 text-left transition text-gray-400">
            <div class="w-9 h-9 rounded-full bg-gray-800 flex items-center justify-center text-sm"><i class="fa-solid fa-plus"></i></div>
            <span class="text-xs font-medium">Use another Google account</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ================= SCREEN 2: PROFILE SETUP ================= -->
    <div id="screen-2" style="display: none;" class="h-full w-full flex-col justify-center px-8 z-10">
      <h2 class="text-2xl font-bold text-white mb-1">What's your name?</h2>
      <p class="text-gray-400 text-xs mb-6">Pehli baar login kar rahe hain, apna nickname aur umar select karein.</p>

      <div class="space-y-5">
        <div>
          <label class="block text-gray-300 text-xs uppercase tracking-wide
